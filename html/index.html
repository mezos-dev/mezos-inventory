<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mezos Inventory</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- Main inventory deck -->
    <div id="app" class="hidden" data-layout="wide"></div>

    <!-- Always-on overlays (work with the inventory closed) -->
    <div id="hotbar" class="hidden"></div>
    <div id="itembox"></div>
    <div id="required" class="hidden"></div>
    <div id="wheel" class="hidden"></div>

    <!-- Floating layers -->
    <div id="tooltip" class="hidden"></div>
    <div id="radial" class="hidden"></div>
    <div id="ghost" class="hidden"></div>
    <div id="modal-root"></div>
    <div id="toasts"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
